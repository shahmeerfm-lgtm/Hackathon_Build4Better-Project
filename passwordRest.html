<!-- GOVERNMENT PORTAL PASSWORD RESET SCENARIO COMPONENT -->
 <link rel="stylesheet" href="css/passwordReset.css">
<div class="browser-viewport">
  <div id="browser-content">
    <div class="gov-container">
      
      <!-- Portal Header -->
      <div class="portal-header">
        <div class="gov-seal">
          <i class="fa-solid fa-landmark"></i>
        </div>
        <div class="portal-title">
          <h3>Official GovServices Account Portal</h3>
          <p>Secure Account Recovery System</p>
        </div>
      </div>

      <!-- Security Notice Banner -->
      <div class="mock-app-card gov-notice-card interactive-element"
           onmouseenter="inspectElement('Official .gov Domain', 'Safe', 'The URL ends in official .gov domain.', 'Government portals always use .gov domains. Fake phishing sites use domain variations like .com or .net.')"
           onclick="inspectElement('Official .gov Domain', 'Safe', 'The URL ends in official .gov domain.', 'Government portals always use .gov domains. Fake phishing sites use domain variations like .com or .net.')">
        <p class="gov-notice-text">
          <i class="fa-solid fa-shield-halved"></i> You are requesting a password reset for account recovery. Always verify you are on an official <strong>.gov</strong> address.
        </p>
      </div>

      <!-- Password Reset Form -->
      <div class="gov-form">
        <div class="form-group interactive-element"
             onmouseenter="inspectElement('Identity Verification', 'Caution', 'Verify your Social Security or ID number safely.', 'Ensure the page has an encrypted HTTPS lock icon in the browser URL bar before entering sensitive details.')"
             onclick="inspectElement('Identity Verification', 'Caution', 'Verify your Social Security or ID number safely.', 'Ensure the page has an encrypted HTTPS lock icon in the browser URL bar before entering sensitive details.')">
          <label class="form-label">User Identifier / Email</label>
          <input type="text" class="mock-input" value="user.recovery@gov.example" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">New Password Selection</label>
          <p class="form-help">Choose a password management strategy:</p>
          
          <div class="password-options">
            <button class="mock-btn-danger action-btn interactive-element"
                    onmouseenter="inspectElement('Weak Password', 'Danger', 'Short and predictable passwords are easy targets.', 'Avoid using simple phrases, birthdays, or repeating numbers.')"
                    onclick="triggerOops('Weak Password Selected!', 'Using predictable passwords makes your government account vulnerable to brute-force credential attacks.')">
              <span><i class="fa-solid fa-key"></i> Option A: <code>Password123</code></span>
              <span class="risk-badge">Unsafe</span>
            </button>

            <button class="mock-btn btn-safe action-btn interactive-element"
                    onmouseenter="inspectElement('Strong Passphrase', 'Safe', 'Long passphrases with mixed characters are highly secure.', 'Combining letters, numbers, and symbols creates strong security against automated crack tools.')"
                    onclick="triggerSuccess('Account Recovered Safely!', 'Excellent! You chose a strong passphrase and verified the official .gov environment.')">
              <span><i class="fa-solid fa-lock"></i> Option B: <code>Tr0pical-88!Breeze#Safe</code></span>
              <span class="risk-badge">Recommended</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
